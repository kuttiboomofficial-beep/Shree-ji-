<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8500">
<title>Visiting Card Scanner — SHREE JI CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:20px 18px;border-bottom:5px solid #ff8500}
header h1{margin:0;font-size:24px} header p{margin:5px 0 0;color:#aaa}
main{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000b}
label{display:block;font-weight:700;margin:14px 0 7px}
input,textarea{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px;background:#fff}
textarea{min-height:100px;resize:vertical}
.preview{width:100%;max-height:430px;object-fit:contain;border-radius:14px;background:#eee;display:none;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:700;cursor:pointer}
.orange{background:#ff8500;color:#fff}.green{background:#188b45;color:#fff}.dark{background:#111;color:#fff}.gray{background:#eee;color:#222}
#file{display:none}
.status{padding:12px;border-radius:10px;background:#fff3df;margin-top:12px;line-height:1.45;display:block}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin-top:10px;display:none}
.progress i{display:block;height:100%;width:0;background:#ff8500;transition:width .2s}
.small{font-size:13px;color:#777;line-height:1.5}
</style>
</head>
<body>
<header><h1>SHREE JI CONNECT</h1><p>Visiting Card Scanner • Auto OCR</p></header>

<main>
<section class="card">
  <div class="row">
    <label class="btn orange" for="file">📷 Take / Choose Card Photo</label>
    <button class="btn dark" id="scan" disabled>🔎 Scan Automatically</button>
  </div>
  <input id="file" type="file" accept="image/*" capture="environment">
  <img id="preview" class="preview" alt="Visiting card preview">
  <div id="status" class="status">📷 Choose a visiting card photo. OCR will start automatically.</div>
  <div id="progress" class="progress"><i id="bar"></i></div>
  <p class="small">The scanner uses browser OCR. Keep the card clear, straight and large in the photo. After scanning, always check the detected details before saving.</p>
</section>

<section class="card">
  <label>Name</label><input id="name" autocomplete="name" placeholder="Auto detected name">
  <label>Mobile</label><input id="mobile" autocomplete="tel" placeholder="Auto detected mobile">
  <label>Company</label><input id="company" placeholder="Auto detected company">
  <label>City</label><input id="city" placeholder="Auto detected city">
  <label>Address</label><textarea id="address" placeholder="Auto detected address"></textarea>
  <label>OCR Text</label><textarea id="raw" placeholder="Detected text"></textarea>
  <div class="row">
    <button class="btn orange" id="save">💾 Save Customer</button>
    <button class="btn gray" id="copy">📋 Copy Details</button>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let selectedFile=null, worker=null;

function setStatus(t){$("status").textContent=t}
function setProgress(v){
  $("progress").style.display="block";
  $("bar").style.width=Math.max(0,Math.min(1,v))*100+"%";
}
function cleanLines(text){
  return text.replace(/\r/g,"").split("\n")
    .map(s=>s.replace(/[|]+/g," ").replace(/\s+/g," ").trim())
    .filter(Boolean);
}

$("file").addEventListener("change", async e=>{
  selectedFile=e.target.files && e.target.files[0];
  if(!selectedFile)return;
  $("preview").src=URL.createObjectURL(selectedFile);
  $("preview").style.display="block";
  $("scan").disabled=false;
  await scanCard();
});
$("scan").onclick=scanCard;

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

function makeVariants(img){
  const max=1800;
  const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1000,Math.round(img.naturalWidth*scale));
  const h=Math.max(700,Math.round(img.naturalHeight*scale));
  const variants=[];

  // Original
  let c=document.createElement("canvas"); c.width=w;c.height=h;
  let x=c.getContext("2d"); x.drawImage(img,0,0,w,h);
  variants.push(c.toDataURL("image/jpeg",0.95));

  // Grayscale + contrast
  c=document.createElement("canvas"); c.width=w;c.height=h;
  x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,w,h);
  let im=x.getImageData(0,0,w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    g=(g-128)*1.8+128;
    g=Math.max(0,Math.min(255,g));
    d[i]=d[i+1]=d[i+2]=g;
  }
  x.putImageData(im,0,0);
  variants.push(c.toDataURL("image/jpeg",0.95));

  return variants;
}

async function getWorker(){
  if(worker)return worker;
  if(!window.Tesseract) throw new Error("Tesseract library did not load.");
  setStatus("⚙️ Loading OCR engine…");
  worker=await Tesseract.createWorker("eng",1,{
    logger:m=>{
      if(m.status==="loading tesseract core") setStatus("⚙️ Loading OCR engine…");
      if(m.status==="loading language traineddata") setStatus("📚 Loading English OCR data…");
      if(m.status==="recognizing text"){
        setStatus("🔎 Reading card… "+Math.round((m.progress||0)*100)+"%");
        setProgress(m.progress||0);
      }
    }
  });
  await worker.setParameters({
    tessedit_pageseg_mode:"6",
    preserve_interword_spaces:"1"
  });
  return worker;
}

async function scanOne(w,imgData){
  const r=await w.recognize(imgData);
  return (r.data.text||"").trim();
}

async function scanCard(){
  if(!selectedFile)return;
  $("scan").disabled=true;
  setStatus("🔎 Starting scanner…");
  setProgress(0);
  try{
    const img=await loadImage(selectedFile);
    const variants=makeVariants(img);
    const w=await getWorker();

    let best="";
    for(let i=0;i<variants.length;i++){
      setStatus("🔎 Scanning image "+(i+1)+" of "+variants.length+"…");
      const t=await scanOne(w,variants[i]);
      if(t.replace(/\s/g,"").length > best.replace(/\s/g,"").length) best=t;
    }

    if(!best) throw new Error("No text detected");
    $("raw").value=best;
    fillFields(best);
    setProgress(1);
    setStatus("✅ Scan complete. Details have been filled automatically. Please check them before saving.");
  }catch(err){
    console.error(err);
    setStatus("❌ OCR failed. Make sure the internet is on, then reload and try a clear close-up card photo.");
  }finally{
    $("scan").disabled=false;
  }
}

function fillFields(text){
  const a=cleanLines(text);
  const joined=text.replace(/\n/g," ");

  // Phone numbers
  const matches=joined.match(/(?:\+?\d[\d\s().-]{7,}\d)/g)||[];
  const phones=matches
    .map(s=>s.trim())
    .filter(s=>s.replace(/\D/g,"").length>=8 && s.replace(/\D/g,"").length<=15);
  $("mobile").value=phones[0]||"";

  // Email
  const email=a.find(s=>/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(s))||"";

  // Company: strongest business-name line, usually near top
  const companyRe=/(gold|diamond|jewel|jewell|traders|store|stores|company|llp|ltd|pvt|inc|creator)/i;
  let company=a.find(s=>companyRe.test(s) && s.length<=90 && !/@/.test(s) && !/\d{7,}/.test(s))||"";
  if(!company){
    const top=a.slice(0,4).find(s=>s.length>=3 && s.length<=60 && !/@/.test(s) && !/\d/.test(s));
    company=top||"";
  }
  $("company").value=company;

  // City/address
  const cityRe=/\b(Coimbatore|Chennai|Madurai|Bengaluru|Bangalore|Mumbai|Delhi|Pune|Abbotsford|Vancouver|Toronto|Thrissur|Ollur|Kochi|Ernakulam|Calicut|Kozhikode)\b/i;
  const cityMatch=joined.match(cityRe);
  $("city").value=cityMatch ? cityMatch[0] : "";

  const addressRe=/(road|street|st\.|avenue|ave\.|park|pl\.|lane|ln\.|nagar|district|dist\.|pin|pincode|via\b|[A-Z]{1,2}\s?\d[A-Z]?\s?\d[A-Z]{2}\b)/i;
  const address=a.filter(s=>
    s!==email &&
    !companyRe.test(s) &&
    !/^\+?[\d\s().-]{8,}$/.test(s) &&
    addressRe.test(s)
  );
  $("address").value=address.join(", ");

  // Name: prefer 2-3 word person-like lines, excluding known card/company terms
  const bad=/(gold|diamond|jewel|jewell|trader|store|company|llp|ltd|pvt|inc|phone|mobile|mob|tel|email|www|http|road|street|avenue|park|nagar|pin|pincode|all kinds|cedar|christopher|via|ollur|thrissur|abbotsford)/i;
  const candidates=a.filter(s=>{
    const w=s.split(/\s+/);
    return s.length>=4 && s.length<=45 && w.length>=2 && w.length<=4 &&
      !bad.test(s) && !/@/.test(s) && !/\d/.test(s);
  });
  $("name").value=(candidates.find(s=>s.split(/\s+/).length===2)||candidates[0]||"");
}

$("copy").onclick=async()=>{
  const t=`Name: ${$("name").value}
Mobile: ${$("mobile").value}
Company: ${$("company").value}
City: ${$("city").value}
Address: ${$("address").value}`;
  try{
    await navigator.clipboard.writeText(t);
    setStatus("✅ Details copied.");
  }catch(e){
    setStatus("⚠️ Copy not available on this browser.");
  }
};

$("save").onclick=()=>{
  const customer={
    id:Date.now(),
    name:$("name").value.trim(),
    mobile:$("mobile").value.trim(),
    company:$("company").value.trim(),
    city:$("city").value.trim(),
    address:$("address").value.trim(),
    createdAt:new Date().toISOString()
  };
  if(!customer.name && !customer.mobile){
    alert("Please scan the card or enter at least Name / Mobile.");
    return;
  }
  try{
    const old=JSON.parse(localStorage.getItem("customers")||"[]");
    const arr=Array.isArray(old)?old:[];
    arr.push(customer);
    localStorage.setItem("customers",JSON.stringify(arr));
    setStatus("✅ Customer saved successfully. Open Customers to verify.");
  }catch(e){
    setStatus("⚠️ Could not save customer in browser storage.");
  }
};
</script>
</body>
</html>
